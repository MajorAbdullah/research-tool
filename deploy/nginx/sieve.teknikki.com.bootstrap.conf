# =============================================================================
# BOOTSTRAP vhost for sieve.teknikki.com — HTTP only, used exactly once.
#
# Why this file exists: the real vhost (sieve.teknikki.com.conf) has a 443
# server block whose `ssl_certificate` points at
# /etc/letsencrypt/live/sieve.teknikki.com/fullchain.pem. That file does not
# exist until certbot has issued the certificate — and nginx refuses to load a
# config referencing a missing certificate, so `nginx -t` FAILS.
#
# That failure is not contained to Sieve. This box serves 20+ other vhosts from
# the same nginx; while the config is invalid, nginx cannot be reloaded at all,
# which blocks any other site's changes and risks a bad restart taking
# everything down. So the real vhost must never be symlinked into
# sites-enabled/ before the certificate exists.
#
# Order (see deploy/README.md §4):
#   1. enable THIS file            -> nginx -t passes, reload is safe
#   2. certbot certonly --nginx    -> certificate now exists
#   3. swap in the real vhost      -> nginx -t passes again, reload
#   4. delete this file's symlink
#
# `--nginx` (not `--webroot`) matches how 21 of the 22 certificates already on
# this box were obtained; certbot records the authenticator in the renewal
# config, so renewals then work exactly like every other site's.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sieve.teknikki.com;

    # The nginx authenticator injects its own challenge location at issue time,
    # so nothing is needed here for that. This root just gives the server block
    # something valid to serve, and matches the webroot path that already
    # exists on this box (/var/www/certbot does NOT exist here).
    root /var/www/letsencrypt;

    location / {
        return 200 "sieve: awaiting certificate\n";
        add_header Content-Type text/plain;
    }
}
