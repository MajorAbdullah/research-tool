# =============================================================================
# nginx vhost for sieve.teknikki.com
#
# Adds ONE file to /etc/nginx/sites-available/, symlinked from
# /etc/nginx/sites-enabled/ — the same per-subdomain vhost pattern already in
# use on this box for every other *.teknikki.com site. This file changes
# nothing global (no edits to nginx.conf, no changes to any other site's
# vhost) — see deploy/README.md for the exact install steps and the
# pre-flight checklist (`sudo nginx -t` must pass, and every other site on
# the box must keep loading, before this is left running unattended).
#
# Upstream: the Sieve container, published ONLY on 127.0.0.1:3060 (never
# 0.0.0.0 — see compose.yml). nginx is the only thing that talks to it.
#
# TLS: obtained via certbot (Let's Encrypt), NOT Cloudflare-proxied — this
# domain's DNS A record points directly at the VPS. See deploy/README.md
# §"TLS" for the exact certbot invocation and the bootstrap step needed
# before the 443 block below has a certificate to point at.
#
# ssl_certificate paths and the two `include`d option files below are
# certbot's own standard, shared locations — the same ones every other
# certbot-issued vhost on this box already references, not something new
# introduced by Sieve.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sieve.teknikki.com;

    # Let certbot's HTTP-01 challenge (or its renewal) reach this vhost
    # directly, over plain HTTP, before falling through to the HTTPS
    # redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sieve.teknikki.com;

    # --- TLS: certbot-managed, standard paths --------------------------------
    ssl_certificate     /etc/letsencrypt/live/sieve.teknikki.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sieve.teknikki.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- WhatsApp .txt export uploads (P12 importer) ---------------------------
    # Default nginx cap (1M) is far too small for a real WhatsApp chat export.
    client_max_body_size 50M;

    # --- Sane baseline timeouts for the app in general -------------------------
    # Overridden longer, specifically, for the streaming chat endpoint below —
    # everything else (page loads, capture, search, item CRUD) is a normal
    # request/response cycle and should fail fast rather than hang.
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # --- Everything except the streaming chat endpoint -------------------------
    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-safe (Sieve doesn't use WebSockets today, but this is the
        # standard, harmless upgrade-header pattern that keeps it working if
        # it ever does — Auth.js, in particular, sometimes wants this).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- POST /api/v1/chat — Server-Sent Events (text/event-stream) -----------
    # docs/API.md §1.3: this endpoint responds with `text/event-stream`, and
    # tokens must reach the browser as the LLM produces them. nginx buffers
    # proxied responses by default, which would hold the entire stream until
    # it either finishes or fills the buffer — defeating the point of SSE
    # (the UI would sit blank, then dump everything at once). This location
    # exists specifically to turn that off, and ONLY for this path — every
    # other endpoint keeps normal buffering, which is the right default for
    # ordinary request/response traffic.
    location /api/v1/chat {
        proxy_pass http://127.0.0.1:3060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        # Belt-and-suspenders: some upstream frameworks also check this
        # response header; harmless to set here regardless.
        add_header X-Accel-Buffering "no";

        # A real answer can take a while to fully stream, especially against
        # a large model under load — give it much more room than the default
        # request/response path above, instead of nginx cutting the
        # connection mid-stream.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
