<!--
  The older Polymer-renderer transcript layout (`ytd-transcript-segment-renderer`
  + `.segment-timestamp`/`.segment-text`) — not observed live this session
  (see the file header in youtube-transcript-assemble.ts), kept here so the
  fallback path in readSegment()/getSegmentElements() has a regression test
  in case an account/session still gets served this UI during a rollout.
-->
<div id="panel-root">
  <ytd-transcript-renderer>
    <ytd-transcript-segment-list-renderer>
      <div id="segments-container">
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:00</div>
          <yt-formatted-string class="segment-text"
            >Today we are looking at how eval harnesses break down</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
        <ytd-transcript-segment-renderer>
          <div class="segment-timestamp">0:12</div>
          <yt-formatted-string class="segment-text"
            >past a few thousand queries.</yt-formatted-string
          >
        </ytd-transcript-segment-renderer>
      </div>
    </ytd-transcript-segment-list-renderer>
  </ytd-transcript-renderer>
</div>
